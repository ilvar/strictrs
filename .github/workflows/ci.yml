name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Capture rustfmt patch
        if: failure()
        shell: bash
        run: |
          cargo fmt
          git diff -- . ':(exclude).github/workflows/ci.yml' > rustfmt.patch

      - name: Upload rustfmt patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  template:
    name: m3 generated project
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build strictrs
        run: cargo build

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(pwd)"
          project_root="$(mktemp -d)"
          cd "$project_root"
          "$workspace/target/debug/strictrs" new hello-strictrs > report.json
          grep -q '"ok": true' report.json
          echo "M3_PROJECT_ROOT=$project_root/hello-strictrs" >> "$GITHUB_ENV"

      - name: Validate generated project
        working-directory: ${{ env.M3_PROJECT_ROOT }}
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked

      - name: Capture generated-project validation
        if: failure()
        shell: bash
        working-directory: ${{ env.M3_PROJECT_ROOT }}
        run: |
          set +e
          {
            echo '=== cargo fmt --check ==='
            cargo fmt --check
            echo '=== cargo clippy ==='
            cargo clippy --all-targets --all-features --locked -- -D warnings
            echo '=== cargo test ==='
            cargo test --locked
          } > "$GITHUB_WORKSPACE/generated-validation.log" 2>&1

      - name: Upload generated-project validation
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: generated-validation
          path: generated-validation.log

      - name: Build and measure MUSL release
        shell: bash
        working-directory: ${{ env.M3_PROJECT_ROOT }}
        run: |
          set -euo pipefail
          cargo release-small
          binary="target/x86_64-unknown-linux-musl/release/hello-strictrs"
          test "$("$binary")" = "Hello from hello-strictrs."
          bytes="$(stat -c '%s' "$binary")"
          echo "M3_TEMPLATE_SIZE_BYTES=$bytes"
          test "$bytes" -lt 50000
