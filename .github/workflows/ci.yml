name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

  template:
    name: m3/m4 generated project
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install host Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install strictrs binary
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/strictrs-install"
          cargo install --path . --root "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          project_root="$(mktemp -d)"
          cd "$project_root"
          strictrs new hello-strictrs > report.json
          grep -q '"ok": true' report.json
          echo "GENERATED_PROJECT_ROOT=$project_root/hello-strictrs" >> "$GITHUB_ENV"

      - name: Resolve M4 lockfile
        shell: bash
        working-directory: ${{ env.GENERATED_PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm Cargo.lock
          cargo generate-lockfile
          cp Cargo.lock "$GITHUB_WORKSPACE/m4-Cargo.lock"

      - name: Upload resolved M4 lockfile
        uses: actions/upload-artifact@v4
        with:
          name: m4-cargo-lock
          path: m4-Cargo.lock

      - name: Stop after lockfile capture
        shell: bash
        run: |
          echo "The resolved M4 lockfile is captured as an artifact for the final deterministic template update."
          exit 1
