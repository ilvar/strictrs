name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        shell: bash
        run: |
          set +e
          cargo fmt --check > "$GITHUB_WORKSPACE/rustfmt.patch" 2>&1
          status=$?
          cat "$GITHUB_WORKSPACE/rustfmt.patch"
          exit "$status"

      - name: Upload rustfmt patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-targets --all-features

      - name: Verify package-less git install
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/git-install"
          cargo install --git "file://$GITHUB_WORKSPACE" --root "$install_root" --locked
          test -x "$install_root/bin/strictrs"

      - name: Verify agent skill installation
        shell: bash
        run: |
          set -euo pipefail
          agent_home="$RUNNER_TEMP/agent-home"
          mkdir -p "$agent_home/.codex" "$agent_home/.claude"

          HOME="$agent_home" PATH="$RUNNER_TEMP/git-install/bin:$PATH" \
            "$RUNNER_TEMP/git-install/bin/strictrs" install-skills \
            > "$RUNNER_TEMP/skills-report.json"
          grep -q '"ok": true' "$RUNNER_TEMP/skills-report.json"
          cmp skills/strictrs/SKILL.md \
            "$agent_home/.agents/skills/strictrs/SKILL.md"
          cmp skills/strictrs/SKILL.md \
            "$agent_home/.claude/skills/strictrs/SKILL.md"

          HOME="$agent_home" PATH="$RUNNER_TEMP/git-install/bin:$PATH" \
            "$RUNNER_TEMP/git-install/bin/strictrs" install-skills \
            > "$RUNNER_TEMP/skills-report-second.json"
          grep -q '"ok": true' "$RUNNER_TEMP/skills-report-second.json"

  template:
    name: generated project
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install strictrs binary
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/strictrs-install"
          cargo install --path . --root "$install_root"
          echo "$install_root/bin" >> "$GITHUB_PATH"

      - name: Generate project
        shell: bash
        run: |
          set -euo pipefail
          project_root="$(mktemp -d)"
          cd "$project_root"
          strictrs new hello-strictrs > report.json
          grep -q '"ok": true' report.json
          echo "GENERATED_PROJECT_ROOT=$project_root/hello-strictrs" >> "$GITHUB_ENV"

      - name: Validate generated project
        working-directory: ${{ env.GENERATED_PROJECT_ROOT }}
        env:
          PROPTEST_CASES: 128
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --locked
          cargo test --locked --test properties
          strictrs check . > strictrs-report.json
          grep -q '"ok": true' strictrs-report.json

      - name: Build and measure MUSL release
        shell: bash
        working-directory: ${{ env.GENERATED_PROJECT_ROOT }}
        run: |
          set +e
          cargo release-small > "$GITHUB_WORKSPACE/template-release.log" 2>&1
          status=$?
          cat "$GITHUB_WORKSPACE/template-release.log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi

          set -euo pipefail
          binary="target/x86_64-unknown-linux-musl/release/hello-strictrs"
          test "$("$binary")" = "Hello from hello-strictrs."
          bytes="$(stat -c '%s' "$binary")"
          echo "$bytes" | tee "$GITHUB_WORKSPACE/template-size-bytes.txt"
          echo "TEMPLATE_SIZE_BYTES=$bytes"

      - name: Upload release failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: template-release-log
          path: template-release.log

      - name: Upload measured size
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: template-size
          path: template-size-bytes.txt

      - name: Enforce size limit
        if: success()
        shell: bash
        run: test "$(cat template-size-bytes.txt)" -lt 400000

  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/test_installer.py
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: shellcheck --norc --shell=bash --enable=all install.sh
  build:
    needs: [test, template, installer]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - name: Native build toolchain
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes musl-tools
          fi
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 "$TARGET"
      - name: Build and smoke test native binary
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            CC=musl-gcc CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc cargo build --release --locked --target "$TARGET"
          else
            cargo build --release --locked --target "$TARGET"
          fi
          "target/$TARGET/release/strictrs" --help >/dev/null
          if [ "$RUNNER_OS" = Linux ]; then
            readelf -l "target/$TARGET/release/strictrs" >"$RUNNER_TEMP/program-headers.txt"
            if grep -q INTERP "$RUNNER_TEMP/program-headers.txt"; then
              echo 'expected a static binary without a dynamic interpreter' >&2
              exit 1
            fi
          fi
      - name: Package with checksum
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/strictrs" "dist/strictrs-$TARGET"
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "strictrs-$TARGET" >"strictrs-$TARGET.sha256"
          else
            sha256sum "strictrs-$TARGET" >"strictrs-$TARGET.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: strictrs-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: strictrs-*
          path: dist
          merge-multiple: true
      - name: Publish new manifest version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving its binaries unchanged. Bump Cargo.toml for a new release."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            tag_commit=$(git rev-parse "$tag^{commit}")
            if [ "$tag_commit" != "$GITHUB_SHA" ]; then
              echo "Unreleased tag $tag points to a different commit; bump the version instead of replacing it." >&2
              exit 1
            fi
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "strictrs $version" --generate-notes --latest
